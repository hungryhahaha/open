# 브리핑을 새로 만들지 않고 페이지만 다시 배포한다 (index.html·브리프 코치 수정, 첫 배포, 수동 재배포용).
name: AI Daily Brief - deploy page only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ai-brief/index.html", "brief-coach/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ai-brief
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          rm -rf _site && mkdir -p _site
          cp ai-brief/index.html _site/index.html
          cp -r ai-brief/data _site/data
          # 브리프 코치 웹앱도 같은 사이트의 /brief-coach/ 에 함께 올린다 (배포마다 사이트 전체가 교체되므로 두 워크플로 모두 포함)
          if [ -d brief-coach ]; then
            mkdir -p _site/brief-coach
            cp brief-coach/index.html brief-coach/manifest.webmanifest brief-coach/sw.js brief-coach/icon.svg brief-coach/icon-*.png _site/brief-coach/
          fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
